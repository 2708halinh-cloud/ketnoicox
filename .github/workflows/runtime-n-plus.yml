name: runtime-n-plus
on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify N+ via Bash
        shell: bash
        run: bash terminal/runtime_n_plus.sh
      - name: Verify N+ via PowerShell
        shell: pwsh
        run: ./terminal/runtime_n_plus.ps1
