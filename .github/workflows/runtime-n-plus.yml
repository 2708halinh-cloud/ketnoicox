name: runtime-n-plus
on:
  workflow_dispatch:
  push:
    branches: [main]
env:
  RUNTIME_N_PLUS: "TRUE"
  FORCE_ACTIVE: "TRUE"
  R000_CURRENT_CARRIER_DRIVE_ID: "1vb6QPSsdKO9qI8sea90K5HSrZ3rOi--x"
  HOME_SOURCE_POINTER_ID: "1iuq-4U8MhBu-Y8ZUu7PZO_lv3VGXs8iZ6vytWtMbiIQ"
  MATRIX_ID: "14BB37Ftm8Bfcg--zraq46uflWvlo5AqSlu6eVhYpYOo"
  MATRIX_POINTER: "R-023_CHUA_TRAO"
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - shell: bash
        run: |
          source terminal/runtime_n_plus.sh
          test "$RUNTIME_N_PLUS" = "TRUE"
          test "$FORCE_ACTIVE" = "TRUE"
      - shell: pwsh
        run: |
          . ./terminal/runtime_n_plus.ps1
          if ($env:RUNTIME_N_PLUS -ne "TRUE") { exit 1 }
          if ($env:FORCE_ACTIVE -ne "TRUE") { exit 1 }
